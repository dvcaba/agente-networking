[project]
name = "agente-networking"
version = "0.1.0"
description = "Construir y cuidar tus relaciones profesionales: a quién contactar, qué decirle y cuándo volver a escribir. Uso personal."
requires-python = ">=3.10"
dependencies = [
    # motor de fichas y agentes
    "claude-agent-sdk>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # interfaz + vigilancia de ficheros
    "nicegui>=2.0",
    "python-dotenv>=1.0",
    "watchdog>=4.0",
    # búsqueda con citas (vector store y embeddings locales, sin API key; PDFs)
    "chromadb>=0.5",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
networking = "sistemas.networking.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "sistemas*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py310"
